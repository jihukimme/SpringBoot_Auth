spring:
  application:
    name: SpringBootTemplate

  datasource:
    url: jdbc:mariadb://my-mariadb:3306/auth?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

jwt:
  accessTokenExpTime: 3600000  # 1?? (60 * 60 * 1000)
  refreshTokenExpTime: 604800000  # 7? (7 * 24 * 60 * 60 * 1000)
  secret: 598552aaff8e56c91489540619ab3cb62fa2ae044a1158b9562464a606f9e820